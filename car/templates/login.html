<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>เข้าสู่ระบบ - Car Monitor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="card p-4" style="width: 350px;">
        <h3 class="text-center mb-4">🔐 เข้าสู่ระบบ</h3>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label text-dark">ชื่อผู้ใช้</label>
                <input type="text" name="username" class="form-control" placeholder="๐๐๐๐๐๐๐๐" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-dark">รหัสผ่าน</label>
                <input type="password" name="password" class="form-control" placeholder="๐๐๐๐๐๐๐๐" required>
            </div>
            <div class="text-center mt-3">
                <a href="{{ url_for('register') }}" class="text-primary">ยังไม่มีบัญชี? สมัครสมาชิกที่นี่</a>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="alert alert-danger mt-3">{{ messages[0] }}</div>
          {% endif %}
        {% endwith %}
    </div>
</body>
</html>
