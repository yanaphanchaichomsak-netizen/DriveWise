<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>สมัครสมาชิก - Car Monitor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="card p-4" style="width: 350px;">
        <h3 class="text-center mb-4">📝 สมัครสมาชิก</h3>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label text-dark">เลือกชื่อผู้ใช้</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-dark">รหัสผ่าน</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-success w-100">ยืนยันการสมัคร</button>
        </form>
        <div class="text-center mt-3">
            <a href="{{ url_for('login') }}" class="text-primary">มีบัญชีอยู่แล้ว? เข้าสู่ระบบ</a>
        </div>
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="alert alert-info mt-3 small">{{ messages[0] }}</div>
          {% endif %}
        {% endwith %}
    </div>
</body>
</html>python
